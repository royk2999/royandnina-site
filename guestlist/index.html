<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>find your table — Nina &amp; Roy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://use.typekit.net/xjy6lud.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --tan:         #ede3d4;
      --gray:        #3b3b3b;
      --black:       #333;
      --green:       #525d3c;
      --border:      rgba(59, 59, 59, 0.1);
      --card-border: rgba(59, 59, 59, 0.2);
    }

    /* scrollbar-gutter reserves the scrollbar lane at all times, so results
       appearing/clearing can't change content width and shift the layout. */
    html {
      font-size: 16px;
      scrollbar-gutter: stable;
    }

    body {
      background: var(--tan);
      color: var(--gray);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Page shell ───────────────────────────────────────── */
    .page {
      max-width: 390px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    /* ── Logo cap ─────────────────────────────────────────── */
    .logo-cap { padding-top: 32px; }

    .monogram {
      display: block;
      height: 90px;
      width: auto;
    }

    /* ── Section body ─────────────────────────────────────── */
    .section-body {
      display: flex;
      flex-direction: column;
      gap: 80px;
      padding: 32px 0 48px;
    }

    /* ── Section hero ─────────────────────────────────────── */
    .section-hero {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    /* H1 — IvyOra Text Regular, 56px */
    .hero-title {
      font-family: "ivyora-text", serif;
      font-weight: 400;
      font-style: normal;
      font-size: 56px;
      line-height: 0.998;
      letter-spacing: -1.12px;
      color: var(--gray);
    }

    /* ── Search bar ───────────────────────────────────────── */
    .search-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.3);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      transition: box-shadow 0.15s;
    }
    .search-bar:focus-within {
      box-shadow: 0 0 0 2px rgba(82, 93, 60, 0.22);
    }

    /* IvyOra Text Italic, 20px — placeholder state */
    .search-input {
      flex: 1 0 0;
      min-width: 0;
      font-family: "ivyora-text", serif;
      font-weight: 400;
      font-style: normal;
      font-size: 20px;
      letter-spacing: -0.4px;
      color: var(--black);
      caret-color: var(--black);
      background: transparent;
      border: none;
      outline: none;
      -webkit-appearance: none;
    }
    /* Placeholder: IvyOra Text Italic, faded gray */
    .search-input::placeholder {
      font-style: italic;
      color: rgba(59, 59, 59, 0.5);
    }

    .search-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      margin: -10px -10px -10px 0;
      flex-shrink: 0;
      background: none;
      border: none;
      cursor: pointer;
      -webkit-appearance: none;
    }
    .search-btn img { display: block; width: 24px; height: 24px; }

    /* ── Results region ───────────────────────────────────── */
    .results-region {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .results-region[hidden] { display: none; }

    /* ── Result card (collapsed) ──────────────────────────── */
    .result-card {
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
    }

    /* Card header — tappable button covering name + table + chevron */
    .result-card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      width: 100%;
      background: none;
      border: none;
      cursor: pointer;
      text-align: left;
      -webkit-appearance: none;
    }

    .result-card-text {
      flex: 1 0 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Figma: py-4px wrapper around each text in the name-table column */
    .result-text-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      padding-block: 4px;
      width: 100%;
    }

    /* IvyOra Text Regular, 20px — card guest name (Figma 1048:1122) */
    .result-name {
      font-family: "ivyora-text", serif;
      font-weight: 400;
      font-style: normal;
      font-size: 20px;
      line-height: normal;
      letter-spacing: -0.4px;
      color: #000;
      opacity: 0.7;
      flex: 1 0 0;
      min-width: 0;
      word-break: break-word;
      text-box: trim-both cap alphabetic;
    }

    /* IvyOra Text Medium, 32px — table number */
    /* line-height:1 not 56px — 56px is a Figma text-box-trim artifact */
    .result-table {
      font-family: "ivyora-text", serif;
      font-weight: 500;
      font-style: normal;
      font-size: 32px;
      line-height: 1;
      letter-spacing: -0.64px;
      color: var(--gray);
      flex: 1 0 0;
      min-width: 0;
      text-box: trim-both cap alphabetic;
    }

    /* Chevron — points right collapsed; rotates 90° CW to point down when expanded */
    /* Collapse uses base 200ms, expand uses 400ms from .expanded override */
    .result-chevron {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      transition: transform 200ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .result-chevron img { display: block; width: 24px; height: 24px; }

    .result-card.expanded .result-chevron {
      transform: rotate(90deg);
      transition: transform 400ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* ── Card expanded body (grid animation) ──────────────── */
    /* Collapse: 200ms fast. Expand: 400ms slow (overridden in .expanded). */
    .result-card-body {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 200ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .result-card.expanded .result-card-body {
      grid-template-rows: 1fr;
      transition: grid-template-rows 400ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .result-card-body-inner { overflow: hidden; }

    /* "You're sitting with:" section */
    /* Figma gap between name-table and this section is 24px; the header
       already contributes 16px of bottom padding, so 8px lands it at 24. */
    .result-card-tablemates {
      padding: 8px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* IvyOra Text Regular, 14px — "You're sitting with:" label */
    .tablemates-label {
      font-family: "ivyora-text", serif;
      font-weight: 400;
      font-style: normal;
      font-size: 14px;
      line-height: normal;
      color: var(--black);
      white-space: nowrap;
    }

    .tablemates-list { display: flex; flex-direction: column; }

    .tablemate-row {
      display: flex;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .tablemate-row:last-child { border-bottom: none; }

    /* Courier Prime Regular, 14px — tablemate names */
    .tablemate-name {
      font-family: "Courier Prime", monospace;
      font-weight: 400;
      font-style: normal;
      font-size: 14px;
      line-height: 29px;
      letter-spacing: 0.42px;
      color: var(--black);
    }

    /* ── No results ───────────────────────────────────────── */
    .no-results-block {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      border-radius: 12px;
    }

    /* IvyOra Text Medium, 24px */
    .no-results-title {
      font-family: "ivyora-text", serif;
      font-weight: 500;
      font-style: normal;
      font-size: 24px;
      line-height: normal;
      letter-spacing: -0.48px;
      color: #000;
      opacity: 0.7;
    }

    /* IvyOra Text Italic, 16px */
    .no-results-sub {
      font-family: "ivyora-text", serif;
      font-weight: 400;
      font-style: italic;
      font-size: 16px;
      line-height: normal;
      letter-spacing: 0.32px;
      color: #000;
      opacity: 0.7;
    }

    /* ── Footer wrap ──────────────────────────────────────── */
    .footer-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ── Browse button group ──────────────────────────────── */
    .browse-button-group { display: flex; flex-direction: column; }

    /* "Browse by table" — border-top only */
    .browse-wrapper--table { border-top: 1px solid var(--border); }

    /* "Browse by guest" — border-top + border-bottom */
    .browse-wrapper--guest {
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    /* Toggle button row */
    .browse-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 16px 0;
      background: none;
      border: none;
      cursor: pointer;
      min-height: 44px;
      -webkit-appearance: none;
    }

    .browse-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .browse-icon img { display: block; width: 24px; height: 24px; }

    /* IvyOra Text Medium, 16px — toggle label */
    .browse-label {
      font-family: "ivyora-text", serif;
      font-weight: 500;
      font-style: normal;
      font-size: 16px;
      line-height: normal;
      color: var(--green);
      white-space: nowrap;
    }

    /* ── Browse list (grid-row animation) ─────────────────── */
    .browse-list-wrap {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 320ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .browse-list-wrap.open { grid-template-rows: 1fr; }
    .browse-list-inner { overflow: hidden; }

    .browse-list {
      padding: 16px 0;
      padding-left: 32px;
    }

    .browse-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      width: 310px;
    }
    .browse-item:last-child { border-bottom: none; }

    /* Courier Prime Regular, 14px — guest name column */
    .browse-col-name {
      font-family: "Courier Prime", monospace;
      font-weight: 400;
      font-style: normal;
      font-size: 14px;
      line-height: 29px;
      letter-spacing: 0.42px;
      color: var(--black);
    }

    /* Courier Prime Bold, 14px — table number column */
    .browse-col-table {
      font-family: "Courier Prime", monospace;
      font-weight: 700;
      font-style: normal;
      font-size: 14px;
      line-height: 29px;
      letter-spacing: 0.42px;
      color: var(--gray);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Footer event block ───────────────────────────────── */
    .footer {
      padding: 32px 0;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* IvyOra Text Regular, 38px */
    .footer-title {
      font-family: "ivyora-text", serif;
      font-weight: 400;
      font-style: normal;
      font-size: 38px;
      line-height: 1.08;
      letter-spacing: -0.76px;
      color: var(--gray);
    }

    /* IvyOra Text Italic, 24px */
    .footer-sub {
      font-family: "ivyora-text", serif;
      font-weight: 400;
      font-style: italic;
      font-size: 24px;
      line-height: normal;
      letter-spacing: -0.48px;
      color: var(--gray);
    }

    /* ── Row fade-in animation ───────────────────────────────── */
    @keyframes row-in {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .result-card-body,
      .result-card.expanded .result-card-body,
      .browse-list-wrap { transition: none; }
      .result-chevron,
      .result-card.expanded .result-chevron { transition: none; }
    }
  </style>
</head>

        <div id="resultsRegion" class="results-region" aria-live="polite" hidden></div>

      </div>

      <!-- ── Browse + footer ── -->

        <div class="browse-button-group">

          <div class="browse-wrapper browse-wrapper--table">
            <button
              class="browse-toggle"
              id="tableToggle"
              type="button"
              aria-expanded="false"
              aria-controls="tableListWrap"

              <span class="browse-icon" id="tableIcon" aria-hidden="true">

            </div>
          </div>

          <!-- Browse by guest -->

            <button

                  <line x1="8" y1="2" x2="8" y2="14" stroke="#525d3c" stroke-width="1.5" stroke-linecap="round"/>
                  <line x1="2" y1="8" x2="14" y2="8" stroke="#525d3c" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
              </span>
              <span class="browse-label">Browse by guest</span>
            </button>
            <div class="browse-list-wrap" id="guestListWrap">
              <div class="browse-list-inner">
                <div class="browse-list" id="guestList" role="list"></div>
              </div>
            </div>
          </div>

        </div>

        <div class="footer">
          <p class="footer-title">Nina &amp; Roy's wedding reception at Mon Cheri on August 28th, 2026</p>
          <p class="footer-sub">Time to eat and party!</p>
        </div>

      </div>
    </div>
  </div>

    // ── Normalize: strip accents, lowercase, collapse spaces ──
    function norm(s) {
      return s
        .normalize('NFD')
        .replace(/[̀-ͯ]/g, '')
        .toLowerCase()
        .replace(/\s+/g, ' ')
        .trim();
    }

    function escHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    // ── Search ────────────────────────────────────────────────
    function runSearch(rawQuery) {
      const q = norm(rawQuery);
      if (!q || q.length < 2) return null;
      return guests.filter(g => {
        const fn = norm(g.first), ln = norm(g.last);
        return fn.includes(q) || ln.includes(q) || (fn + ' ' + ln).includes(q);
      });
    }

    // ── Tablemates for a given guest ──────────────────────────
    function getTablemates(guest) {
      if (!guest.table) return [];
      return guests
        .filter(g => g.table === guest.table && !(norm(g.first) === norm(guest.first) && norm(g.last) === norm(guest.last)))
        .sort((a, b) => {
          const la = norm(a.last), lb = norm(b.last);
          if (la !== lb) return la < lb ? -1 : 1;
          return norm(a.first) < norm(b.first) ? -1 : 1;
        });
    }

    // ── Row animation helper ──────────────────────────────────
    function animateRows(card, expanding) {
      const rows = card.querySelectorAll('.tablemate-row');
      if (expanding) {
        rows.forEach((row, i) => {
          row.style.animation = 'none';
          row.offsetHeight; // force reflow to restart animation
          const delay = 60 + Math.min(i, 8) * 35;
          row.style.animation = `row-in 200ms ease-out ${delay}ms both`;
        });
      } else {
        rows.forEach(row => { row.style.animation = 'none'; });
      }
    }

    // ── Render results ────────────────────────────────────────
    const MAX_CARDS = 5;

    const PLUS_SVG  = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="8" y1="2" x2="8" y2="14" stroke="#525d3c" stroke-width="1.5" stroke-linecap="round"/><line x1="2" y1="8" x2="14" y2="8" stroke="#525d3c" stroke-width="1.5" stroke-linecap="round"/></svg>`;
    const MINUS_SVG = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="2" y1="8" x2="14" y2="8" stroke="#525d3c" stroke-width="1.5" stroke-linecap="round"/></svg>`;

    function renderResults(matches) {
      const el = document.getElementById('resultsRegion');
      if (matches === null) {
        el.hidden = true;
        el.innerHTML = '';
        return;
      }

      el.hidden = false;

      if (matches.length === 0) {
        el.innerHTML = `
          <div class="no-results-block">
            <p class="no-results-title">No results :(</p>
            <p class="no-results-sub">Try searching the primary guest in your party or browse the lists below.</p>
          </div>`;
        return;
      }

      const autoExpand = matches.length === 1;
      const shown = matches.slice(0, MAX_CARDS);

      el.innerHTML = shown.map((g, i) => {
        const tablemates = getTablemates(g);
        const isExpanded = autoExpand && i === 0;
        const tableSuffix = g.table ? `Table ${escHtml(g.table)}` : '—';

        const tableMatesHtml = tablemates.length > 0 ? `
          <div class="result-card-tablemates">
            <p class="tablemates-label">You're sitting with:</p>
            <div class="tablemates-list">
              ${tablemates.map(t => `
                <div class="tablemate-row">
                  <span class="tablemate-name">${escHtml(t.last)}, ${escHtml(t.first)}</span>
                </div>`).join('')}
            </div>
          </div>` : '';

        return `
          <div class="result-card${isExpanded ? ' expanded' : ''}">
            <button class="result-card-header" type="button" aria-expanded="${isExpanded}">
              <div class="result-card-text">
                <div class="result-text-wrap">
                  <p class="result-name">${escHtml(g.last)}, ${escHtml(g.first)}</p>
                </div>
                <div class="result-text-wrap">
                  <p class="result-table">${tableSuffix}</p>
                </div>
              </div>
              <span class="result-chevron" aria-hidden="true">
                <img src="../assets/card-chevron.svg" alt="">
              </span>
            </button>
            <div class="result-card-body">
              <div class="result-card-body-inner">
                ${tableMatesHtml}
              </div>
            </div>
          </div>`;
      }).join('');

      // Wire card expand/collapse
      el.querySelectorAll('.result-card-header').forEach(btn => {
        btn.addEventListener('click', () => {
          const card = btn.closest('.result-card');
          const expanded = card.classList.toggle('expanded');
          btn.setAttribute('aria-expanded', String(expanded));
          animateRows(card, expanded);
        });
      });

      // Animate rows on auto-expanded card after first render
      if (autoExpand) {
        requestAnimationFrame(() => {
          const card = el.querySelector('.result-card.expanded');
          if (card) animateRows(card, true);
        });
      }
    }

    // ── Build browse by table ─────────────────────────────────
    function buildTableBrowse() {
      const sorted = [...guests].sort((a, b) => {
        const ta = parseInt(a.table, 10) || 0;
        const tb = parseInt(b.table, 10) || 0;
        if (ta !== tb) return ta - tb;
        const la = norm(a.last), lb = norm(b.last);
        if (la !== lb) return la < lb ? -1 : 1;
        return norm(a.first) < norm(b.first) ? -1 : 1;
      });

      document.getElementById('tableList').innerHTML = sorted.map(g => {
        const tbl = g.table ? `Table ${escHtml(g.table)}` : 'tbd';
        return `
          <div class="browse-item" role="listitem">
            <span class="browse-col-table">${tbl}</span>
            <span class="browse-col-name">${escHtml(g.last)}, ${escHtml(g.first)}</span>
          </div>`;
      }).join('');
    }

    // ── Build browse by guest ─────────────────────────────────
    function buildGuestBrowse() {
      const sorted = [...guests].sort((a, b) => {
        const la = norm(a.last), lb = norm(b.last);
        if (la !== lb) return la < lb ? -1 : 1;
        return norm(a.first) < norm(b.first) ? -1 : 1;
      });

      document.getElementById('guestList').innerHTML = sorted.map(g => {
        const tbl = g.table ? `Table ${escHtml(g.table)}` : 'tbd';
        return `
          <div class="browse-item" role="listitem">
            <span class="browse-col-name">${escHtml(g.last)}, ${escHtml(g.first)}</span>
            <span class="browse-col-table">${tbl}</span>
          </div>`;
      }).join('');
    }

    // ── Browse accordion ──────────────────────────────────────
    function openBrowse(wrap, icon, toggle) {
      wrap.classList.add('open');
      toggle.setAttribute('aria-expanded', 'true');
      icon.innerHTML = MINUS_SVG;
    }

    function closeBrowse(wrap, icon, toggle) {
      wrap.classList.remove('open');
      toggle.setAttribute('aria-expanded', 'false');
      icon.innerHTML = PLUS_SVG;
    }

    // ── Event wiring ──────────────────────────────────────────
    const searchInput    = document.getElementById('searchInput');
    const searchBtn      = document.getElementById('searchBtn');
    const searchIcon     = document.getElementById('searchIcon');
    const tableToggle    = document.getElementById('tableToggle');
    const tableListWrap  = document.getElementById('tableListWrap');
    const tableIcon      = document.getElementById('tableIcon');
    const guestToggle    = document.getElementById('guestToggle');
    const guestListWrap  = document.getElementById('guestListWrap');
    const guestIcon      = document.getElementById('guestIcon');

    // Arrow icon while empty; X (clear) icon once there's text
    function syncSearchIcon() {
      const hasText = searchInput.value.length > 0;
      searchIcon.src = hasText ? '../assets/search-x.svg' : '../assets/search-arrow.svg';
      searchBtn.setAttribute('aria-label', hasText ? 'Clear search' : 'Search');
    }

    searchInput.addEventListener('input', () => {
      renderResults(runSearch(searchInput.value));
      syncSearchIcon();
    });

    searchBtn.addEventListener('click', () => {
      if (searchInput.value.length > 0) {
        searchInput.value = '';
        syncSearchIcon();
      }
      renderResults(runSearch(searchInput.value));
      searchInput.focus();
    });

    searchInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') renderResults(runSearch(searchInput.value));
    });

    tableToggle.addEventListener('click', () => {
      const willOpen = !tableListWrap.classList.contains('open');
      closeBrowse(guestListWrap, guestIcon, guestToggle);
      if (willOpen) openBrowse(tableListWrap, tableIcon, tableToggle);
      else closeBrowse(tableListWrap, tableIcon, tableToggle);
    });

    guestToggle.addEventListener('click', () => {
      const willOpen = !guestListWrap.classList.contains('open');
      closeBrowse(tableListWrap, tableIcon, tableToggle);
      if (willOpen) openBrowse(guestListWrap, guestIcon, guestToggle);
      else closeBrowse(guestListWrap, guestIcon, guestToggle);
    });

    buildTableBrowse();
    buildGuestBrowse();
  </script>
